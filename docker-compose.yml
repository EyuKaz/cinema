version: "3.9"
services:
  # thin shell container for Codespaces
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity

  # --- Microservices (match the repo folder names) --------------------------
  gateway:
    build: ../server-gateway
    ports: ["5000:5000"]
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]

  catalog:
    build: ../server-catalog
    ports: ["5001:5001"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - REDIS_URL=redis://redis:6379
    depends_on: [db, redis]

  payments:
    build: ../server-payments
    ports: ["5002:5002"]
    environment:
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]

  recommendations:
    build: ../server-recommendations
    ports: ["5003:5003"]
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]

  client:
    build: ../client
    ports: ["5173:5173"]
    volumes:
      - ../client:/app
      - /app/node_modules

  # --- Infra ----------------------------------------------------------------
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinemaos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cinemaos
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres-data:
