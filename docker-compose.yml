version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://cinemaos:password@localhost:5432/cinemaos
      - REDIS_URL=redis://localhost:6379
      - NODE_ENV=development
      - PORT=5000
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: cinemaos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cinemaos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: