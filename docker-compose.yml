version: "3.9"

services:
  gateway:
    build:
      context: ./apps/gateway
    ports: ["5000:5000"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - REDIS_URL=redis://redis:6379
    depends_on: [db, redis]

  auth:
    build:
      context: ./services/auth
    ports: ["5001:5001"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - REDIS_URL=redis://redis:6379

  booking:
    build:
      context: ./services/booking
    ports: ["5002:5002"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - REDIS_URL=redis://redis:6379

  cinema:
    build:
      context: ./services/cinema
    ports: ["5003:5003"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos

  movie:
    build:
      context: ./services/movie
    ports: ["5004:5004"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos

  payment:
    build:
      context: ./services/payment
    ports: ["5005:5005"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY}

  showtime:
    build:
      context: ./services/showtime
    ports: ["5006:5006"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos
      - REDIS_URL=redis://redis:6379

  ticket:
    build:
      context: ./services/ticket
    ports: ["5007:5007"]
    environment:
      - DATABASE_URL=postgresql://cinemaos:password@db:5432/cinemaos

  frontend:
    build:
      context: ./apps/frontend
    ports: ["3000:3000"]

  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
    ports: ["3001:3001"]

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cinemaos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cinemaos
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres-data:
